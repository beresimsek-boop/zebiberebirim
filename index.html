<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Nunito Sans', sans-serif; background: #f6f0e6; }
  button, input, textarea { font-family: inherit; }
  .dm-btn:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
  .dm-btn:active:not(:disabled) { transform: translateY(0); filter: brightness(0.97); }
  .study-room-shell {
    position: relative; min-height: 560px; overflow: hidden; border-radius: 28px;
    background:
      radial-gradient(circle at 18% 16%, rgba(255,255,255,.95) 0 2px, transparent 3px),
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(255,244,222,.55), transparent 65%),
      linear-gradient(180deg, #f8e8d6 0%, #ead2bc 52%, #d8b28f 53%, #bd8c61 100%);
    box-shadow: inset 0 0 90px rgba(93,52,24,.12), 0 24px 60px rgba(86,55,31,.16);
  }
  .study-room-shell:before {
    content:""; position:absolute; inset:0; pointer-events:none; z-index: 6;
    background:
      radial-gradient(ellipse 120% 90% at 50% 105%, rgba(40,20,8,.16), transparent 60%),
      linear-gradient(90deg, rgba(255,255,255,.30), transparent 22%, transparent 78%, rgba(90,49,22,.12)),
      repeating-linear-gradient(90deg, rgba(104,63,37,.045) 0 2px, transparent 2px 44px);
  }
  .study-lamp {
    position:absolute; width:150px; height:150px; border-radius:50%; right:7%; top:5%;
    background: radial-gradient(circle, rgba(255,232,175,.85) 0%, rgba(255,226,157,.35) 40%, rgba(255,226,157,0) 70%);
    filter: blur(2px);
  }
  .room-window {
    position:absolute; left:5%; top:4%; width:150px; height:150px; border-radius:16px; z-index:1;
    background: linear-gradient(180deg,#bfe3fa,#e9f5ff 55%,#fdf4e3 100%);
    border:8px solid #7c4c2a; box-shadow: 0 14px 30px rgba(60,35,15,.22), inset 0 0 20px rgba(255,255,255,.4);
  }
  .room-window:before, .room-window:after {
    content:""; position:absolute; background:#7c4c2a;
  }
  .room-window:before { left:50%; top:0; bottom:0; width:6px; transform:translateX(-50%); }
  .room-window:after { top:50%; left:0; right:0; height:6px; transform:translateY(-50%); }
  .room-window .cloud { position:absolute; background:#fff; border-radius:50%; opacity:.85; }
  .room-shelf {
    position:absolute; height:14px; border-radius:4px;
    background: linear-gradient(180deg,#a06e46,#7c4c2a); box-shadow: 0 8px 14px rgba(40,20,8,.28);
  }
  .room-book { position:absolute; bottom:14px; border-radius:2px 2px 0 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
  .room-plant-pot {
    position:absolute; width:44px; height:34px; border-radius:6px 6px 14px 14px;
    background: linear-gradient(180deg,#c4784a,#9a5c33); box-shadow:0 10px 16px rgba(30,15,5,.3);
  }
  .room-plant-leaf {
    position:absolute; border-radius:0 100% 0 100%; background:#5c9468;
    box-shadow: inset -4px -4px 8px rgba(0,0,0,.15);
  }
  .room-rug {
    position:absolute; left:50%; bottom:6%; transform:translateX(-50%);
    width:60%; max-width:420px; height:60px; border-radius:50%;
    background: radial-gradient(ellipse, rgba(141,99,216,.28), rgba(141,99,216,.08) 60%, transparent 72%);
    box-shadow: inset 0 0 0 3px rgba(141,99,216,.18);
  }
  .room-lights { position:absolute; left:0; right:0; top:0; height:26px; z-index:5; pointer-events:none; }
  .room-lights .bulb {
    position:absolute; top:14px; width:8px; height:8px; border-radius:50%;
    background: radial-gradient(circle, #ffe9a8, #f6c34a);
    box-shadow: 0 0 8px 3px rgba(255,220,140,.85);
    animation: bulb-twinkle 2.4s ease-in-out infinite;
  }
  @keyframes bulb-twinkle { 0%,100%{opacity:.55; transform:scale(.85)} 50%{opacity:1; transform:scale(1)} }
  .room-frame {
    position:absolute; border-radius:8px; background:#fffaf2; border:6px solid #6c4a2c;
    box-shadow: 0 10px 18px rgba(30,15,5,.26);
  }
  .study-table {
    position:absolute; left:8%; right:8%; top:37%; height:250px; border-radius:42% 42% 26px 26px;
    background: linear-gradient(180deg,#a06e46,#7c4c2a 55%,#663a20 85%, #562f19 100%);
    border: 7px solid #5b331f;
    box-shadow: 0 30px 26px -12px rgba(40,20,8,.38), 0 8px 40px rgba(54,30,17,.22), inset 0 10px 18px rgba(255,255,255,.12);
    transform: perspective(900px) rotateX(7deg);
  }
  .study-table:after {
    content:""; position:absolute; left:7%; right:7%; top:15%; height:68%;
    border-radius:50%; border:1px solid rgba(255,255,255,.16);
    background: radial-gradient(ellipse 70% 60% at 30% 20%, rgba(255,255,255,.10), transparent 55%);
    box-shadow: inset 0 0 34px rgba(36,18,8,.22);
  }
  .table-center {
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); z-index:3;
    width:150px; padding:9px 12px; border-radius:16px; text-align:center;
    background:rgba(255,248,238,.92); color:#5b3a27; box-shadow:0 10px 24px rgba(45,25,14,.22), inset 0 1px 0 rgba(255,255,255,.6);
    font-family:'Fraunces',serif; font-weight:700;
  }
  .table-seat {
    position:absolute; z-index:8; width:130px; text-align:center; transform-origin:center bottom;
  }
  .table-seat .chair {
    position:absolute; left:50%; top:48px; transform:translateX(-50%); width:100px; height:112px;
    border-radius:34px 34px 20px 20px; background:linear-gradient(150deg,#69748a,#3a4552 60%,#2c343e);
    box-shadow:0 16px 22px -4px rgba(20,14,10,.35), inset 0 2px 3px rgba(255,255,255,.14); z-index:-1;
  }
  .table-person { animation: seated-breathe 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 8px rgba(30,18,10,.2)); }
  @keyframes seated-breathe { 0%,100%{transform:translateY(4px) scale(.98)} 50%{transform:translateY(-3px) scale(1)} }
  .seat-contact-shadow {
    position:absolute; left:50%; top:150px; transform:translateX(-50%);
    width:78px; height:16px; border-radius:50%; background:radial-gradient(ellipse, rgba(20,10,4,.35), transparent 70%);
    z-index:-1; filter: blur(1px);
  }
  .desk-prop {
    position:absolute; left:50%; top:128px; transform:translateX(28px) rotate(-8deg); font-size:20px; z-index:7;
    animation: desk-prop-bob 3.6s ease-in-out infinite; filter: drop-shadow(0 3px 4px rgba(30,18,10,.25));
  }
  @keyframes desk-prop-bob { 0%,100%{transform:translateX(28px) rotate(-8deg) translateY(0)} 50%{transform:translateX(28px) rotate(-6deg) translateY(-2px)} }
  .steam-wisp { position:absolute; width:5px; border-radius:6px; background: rgba(255,255,255,.55); filter: blur(1.5px); animation: steam-rise 2.6s ease-in infinite; pointer-events:none; }
  @keyframes steam-rise { 0%{opacity:0; height:0; transform:translateY(0) translateX(0)} 20%{opacity:.65} 70%{opacity:.2} 100%{opacity:0; height:22px; transform:translateY(-26px) translateX(4px)} }

  @keyframes fade-in-up { 0%{opacity:0; transform:translateY(10px)} 100%{opacity:1; transform:translateY(0)} }
  .fade-in-scale { animation: fade-in-scale .5s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes fade-in-scale { 0%{opacity:0; transform:scale(.96)} 100%{opacity:1; transform:scale(1)} }

  .seat-0{left:2%;top:31%}.seat-1{left:22%;top:13%}.seat-2{left:43%;top:10%}.seat-3{left:64%;top:13%}.seat-4{right:2%;top:31%}

  .garden-hill { position:absolute; bottom:-20px; border-radius: 50%; background: rgba(255,255,255,.14); }

  .garden-bench:before { content:""; position:absolute; left:6px; right:6px; top:-30px; height:30px; border-radius:6px 6px 0 0; background: linear-gradient(180deg,#c4884a,#9a6634); }
  .garden-bench-leg { position:absolute; bottom:-18px; width:8px; height:18px; background:#6b431f; border-radius:2px; }

  .break-timer-display { font-family:'Fraunces',serif; font-size:44px; font-weight:700; color:#33502a; }
  .break-preset { border:1px solid #cfe3b8; background:#f4faec; color:#3d5c2e; border-radius:14px; padding:9px 10px; cursor:pointer; transition:.18s ease; font-weight:700; }
  .break-preset:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(60,110,30,.14); }
  .break-preset.active { background:linear-gradient(135deg,#6fbf5e,#4f9e46); color:#fff; border-color:#4f9e46; box-shadow:0 8px 18px rgba(79,158,70,.30); }
  .booster-card { border:1px solid #eadbc9; background:linear-gradient(135deg,#fffaf4,#f8efe5); border-radius:16px; padding:14px; transition:transform .18s ease, box-shadow .18s ease; }
  .booster-card:hover { transform: translateY(-3px); box-shadow: 0 14px 26px rgba(90,56,31,.14); }
  .active-booster-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:linear-gradient(135deg,#8d63d8,#6f4bc1); color:#fff; font-weight:700; font-size:12px; box-shadow:0 8px 18px rgba(111,75,193,.30); }
